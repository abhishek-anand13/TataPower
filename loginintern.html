<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form - Tata Power</title>
    <link rel="stylesheet" href="stylelogin.css">
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="container">
            <div class="logo">Tata Power</div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="open_positions.html">Open Positions</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Application Form Section -->
    <section class="application-form">
        <div class="container">
            <h1>Application Form</h1>
            <p>Fill out the form below to apply for the internship.</p>

            <form action="submit_application.php" method="POST">
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                </div>

                <div class="form-group">
                    <label for="position">Position Applying For</label>
                    <select id="position" name="position" required>
                        <option value="">Select a position</option>
                        <option value="UI/UX Design Intern">UI/UX Design Intern</option>
                        <option value="Software Development Intern">Software Development Intern</option>
                        <option value="Data Analyst Intern">Data Analyst Intern</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="resume">Upload Resume</label>
                    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
                </div>

                <div class="form-group">
                    <label for="message">Additional Message (Optional)</label>
                    <textarea id="message" name="message" placeholder="Enter any additional information"></textarea>
                </div>

                <button type="submit" class="apply-btn">Submit Application</button>
            </form>
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Tata Power. All rights reserved.</p>
            <nav class="footer-nav">
                <a href="index.html">Home</a>
                <a href="open_positions.html">Open Positions</a>
            </nav>
        </div>
    </footer>
</body>
</html>
