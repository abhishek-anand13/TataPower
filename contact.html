<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="stylecontact.css">
    <script src="main.js" defer></script>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>

    <section class="contact-form">
        <h2>Have a Question? Reach Out to Us!</h2>
        <form id="contactForm">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Your Email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea>

            <button type="submit">Submit</button>
        </form>
        <div id="formMessage" class="form-message"></div>
    </section>

    <section class="company-info">
        <h2>Our Location</h2>
        <div class="map-container">
            <!-- Embed Google Map of company location -->
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.1616640139737!2d144.9537353153168!3d-37.8172099797512!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d5e2a46547f%3A0xd0263139b6f7d75a!2sGoogle!5e0!3m2!1sen!2sus!4v1683618367465!5m2!1sen!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </section>

    <section class="support-info">
        <h2>Contact Support</h2>
        <p>If you need immediate assistance, please reach out to us through the following channels:</p>
        <ul>
            <li>Email: <a href="mailto:support@example.com">support@example.com</a></li>
            <li>Phone: <a href="tel:+1234567890">+1 (234) 567-890</a></li>
        </ul>
    </section>
</body>
</html>
