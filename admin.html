<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Tata Power</title>
    <link rel="stylesheet" href="styleadmin.css">
    <script src="main.js" defer></script>
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="container">
            <div class="logo">Tata Power</div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="admin_dashboard.html">Admin Dashboard</a></li>
                    <li><a href="logout.html">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Admin Dashboard Section -->
    <section class="admin-dashboard">
        <div class="container">
            <h1>Admin Dashboard</h1>
            <div class="filters">
                <label for="position">Position:</label>
                <select id="position" name="position">
                    <option value="">All</option>
                    <option value="UI/UX Design Intern">UI/UX Design Intern</option>
                    <option value="Software Development Intern">Software Development Intern</option>
                    <option value="Data Analyst Intern">Data Analyst Intern</option>
                </select>

                <label for="education">Education:</label>
                <select id="education" name="education">
                    <option value="">All</option>
                    <option value="Bachelor's Degree">Bachelor's Degree</option>
                    <option value="Master's Degree">Master's Degree</option>
                    <option value="Other">Other</option>
                </select>

                <label for="status">Status:</label>
                <select id="status" name="status">
                    <option value="">All</option>
                    <option value="Under Review">Under Review</option>
                    <option value="Shortlisted">Shortlisted</option>
                    <option value="Rejected">Rejected</option>
                </select>

                <button onclick="filterApplications()">Filter</button>
            </div>

            <table id="applications-table">
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Position</th>
                        <th>Education</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Application rows will be inserted dynamically -->
                </tbody>
            </table>
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Tata Power. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
